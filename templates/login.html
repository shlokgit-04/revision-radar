{% extends "base.html" %}
{% block title %}Sign in — Revision Radar{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="brand-row"><span class="brand-mark">RR</span> Revision Radar</div>
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="auth-sub">Your syllabus and plan, saved on your account.</p>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <div class="err" id="authErr"></div>
      <button type="submit" class="btn primary">Sign in</button>
    </form>
    <p class="auth-alt">No account yet? <a href="/register">Create one</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='login.js') }}"></script>{% endblock %}
